# 스마트폰으로 택시 앱을 열려면 이 아이템을 하나 이상 가지고 있어야 합니다.
# NPC는 택시 정류장 반경 안에 있어야 하며, 호출권 없이 우클릭하면 지도에 바로 진입합니다.
access:
  call_pass:
    material: PAPER
    name: "&e택시 호출권"
    model_data: 1132
  npc:
    enabled: true
    name: "택시 기사"

ui:
  title_main: "&e🚕 이동 중..."
  title_sub: "&7목적지: {stop_name}"
  title_fade_in_ms: 250
  title_stay_ms: 1250
  title_fade_out_ms: 250
  teleport_delay_ticks: 60

messages:
  arrived: "&a[SHARK T] {stop_name}에 도착하였습니다!"
  loading_app: "&e[SHARK T] &a앱을 로딩하는 중..."
  unavailable_service: "&c[SHARK T] 아직 사용할 수 없는 서비스입니다."
  no_call_pass: "&c[SHARK T] 택시 호출권이 필요합니다. 정류장 NPC에게 문의하세요."

